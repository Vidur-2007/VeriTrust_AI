<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="VeriTrust AI: a Maker and Judge guardrail that stops an airline support bot from giving customers wrong answers." />
    <title>VeriTrust AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply saved viewer preferences before first paint (dark theme and full motion are the defaults).
      try {
        if (localStorage.getItem('veritrust-theme') === 'light') document.documentElement.dataset.theme = 'light'
        if (localStorage.getItem('veritrust-reduce-motion') === '1') document.documentElement.dataset.motion = 'reduce'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
